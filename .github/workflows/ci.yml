# CI — lint, typecheck, unit tests, and the real-solver integration path on every
# push / PR. The `dev` extra pulls in `yowasp-yosys` (WASM Yosys), so the yosys-sat
# integration tests and the recorded-LLM replay run in CI with no external toolchain
# and no API key. Tests needing SymbiYosys or a live model skip cleanly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # fail fast instead of burning the default 6h cap if a solve hangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Unit tests
        run: pytest

      - name: Integration (real proofs via yosys-sat + recorded-LLM replay)
        run: pytest -m integration

  # Optional heavy job: the sby + Bitwuzla backend via the full OSS CAD Suite. Enable
  # once the sby adapter is verified live (its tests are written but unrun).
  # It un-skips the sby-gated integration tests.
